name: YD Automation Tests

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA
      # =========================================================

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # =========================================================
      # VERIFY JAVA
      # =========================================================

      - name: Verify Java
        run: java -version

      # =========================================================
      # VERIFY MAVEN
      # =========================================================

      - name: Verify Maven
        run: mvn -version

      # =========================================================
      # RUN TESTNG
      # =========================================================

      - name: Run TestNG Suite
        run: mvn clean test

      # =========================================================
      # UPLOAD REPORTS + SCREENSHOTS
      # =========================================================

      - name: Upload TestNG Reports and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            test-output/
            target/screenshots/
          if-no-files-found: ignore
