name: YD Automation Tests

on:
  push:
    branches:
      - master

  schedule:
    # 10:00 AM IST
    - cron: '30 4 * * *'

    # 5:00 PM IST
    - cron: '30 11 * * *'

  workflow_dispatch:

jobs:
  YD_Automation:

    runs-on: windows-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # SET SCREEN RESOLUTION
      # =========================================================

      - name: Set Windows Screen Resolution
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080
        shell: powershell

      # =========================================================
      # JAVA
      # =========================================================

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # =========================================================
      # VERIFY JAVA
      # =========================================================

      - name: Verify Java
        run: java -version

      # =========================================================
      # VERIFY MAVEN
      # =========================================================

      - name: Verify Maven
        run: mvn -version

      # =========================================================
      # RUN TESTNG
      # =========================================================

      - name: Run TestNG Suite
        run: mvn clean test

      # =========================================================
      # UPLOAD REPORTS + SCREENSHOTS
      # =========================================================

      - name: Upload Test Reports and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            reports/
            test-output/
            target/surefire-reports/
            target/screenshots/

          if-no-files-found: ignore
